<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CareConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center font-sans">

  <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
    <!-- Logo del proyecto -->
    <div class="flex items-center justify-center mb-6">
      <img src="https://i.ibb.co/JF7RCJkX/logo-sin-nombre.png" alt="Logo del proyecto" class="h-16 w-16 mr-2" />
      <h1 class="text-3xl font-bold text-blue-900">CareConnect</h1>
    </div>

    <!-- Mensaje de bienvenida -->
    <div class="mb-6 text-center">
      <h2 class="text-xl font-semibold text-gray-800">¡Bienvenido de nuevo!</h2>
      <p class="text-sm text-gray-600">Inicia sesión para continuar.</p>
    </div>

    <!-- Formulario de login -->
    <form>
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="email">Correo electrónico o usuario</label>
        <input type="text" id="email" placeholder="ejemplo@correo.com" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="mb-6">
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl transition">
          Iniciar sesión
        </button>
      </div>

      <div class="text-center text-sm text-gray-600">
        ¿No tienes cuenta? 
        <a href="registro.html" class="text-purple-600 hover:underline font-medium">Regístrate</a>
      </div>
    </form>
  </div>

</body>
</html>
