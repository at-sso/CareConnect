<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subir Documentos - CareConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-blue-50 min-h-screen flex items-center justify-center font-sans"
  >
    <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-2xl">
      <!-- Encabezado -->
      <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-blue-900 mb-2">Subir Documentos</h1>
        <p class="text-gray-600">
          Por favor adjunta los documentos requeridos para completar tu
          registro.
        </p>
      </div>

      <!-- Formulario de archivos -->
      <form>
        <div class="space-y-6">
          <!-- Cedula -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Foto de Cédula / ID</label
            >
            <input
              type="file"
              accept="image/*,.pdf"
              class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50"
              required
            />
          </div>

          <!-- Recetas -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Recetas Médicas (si aplica)</label
            >
            <input
              type="file"
              accept="image/*,.pdf"
              class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50"
            />
          </div>

          <!-- Historial Médico -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Historial Médico</label
            >
            <input
              type="file"
              accept="image/*,.pdf"
              class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50"
              required
            />
          </div>
        </div>

        <!-- Botón Finalizar -->
        <div class="text-right mt-10">
          <button
            type="submit"
            class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-xl transition"
          >
            Finalizar
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
